<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahayak - Login</title>
    <link rel="stylesheet" href="style6.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f8f4ed;
        }

        .nav-right {
            gap: 18px;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid #5a4032;
            background: transparent;
            color: #5a4032;
            border-radius: 25px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-button:hover {
            background: #5a4032;
            color: #fff;
        }

        .auth-main {
            padding-bottom: 60px;
        }

        .auth-shell {
            width: min(90%, 540px);
            margin: 0 auto 40px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #ebdfd3;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(61, 40, 30, 0.08);
            padding: 32px 28px;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }

        .auth-message.error {
            display: block;
            background: #fff4f4;
            border: 1px solid #f3d5d4;
            color: #a42b2b;
        }

        .auth-message.success {
            display: block;
            background: #edfdf3;
            border: 1px solid #bde7c8;
            color: #1d7a4d;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            color: #45352d;
            font-size: 14px;
            font-weight: 600;
        }

        .field input,
        .field select {
            width: 100%;
            border: 1px solid #e5d9cd;
            border-radius: 12px;
            background: #fffdf9;
            color: #45352d;
            padding: 14px 16px;
            font-size: 15px;
            font-family: "DM Sans", sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: #b86f52;
            box-shadow: 0 0 0 3px rgba(184, 111, 82, 0.12);
        }

        .primary-btn {
            background: #5a4032;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .primary-btn:hover {
            background: #3b2921;
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            color: #81746b;
            font-size: 14px;
        }

        .auth-footer a {
            color: #5a4032;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="home.html" class="logo">
            <div class="logo-icon">S</div>
            <span>SAHAYAK</span>
        </a>

        <nav>
            <a href="home.html">Home</a>
            <a href="services.html">Services</a>
            <a href="#">How it works</a>
            <a href="#">About us</a>
        </nav>

        <div class="nav-right">
            <span>⌖ Lucknow</span>
            <a href="register.html" class="nav-button">Create account</a>
        </div>
    </header>

    <main class="auth-main">
        <section class="page-heading">
            <p>WELCOME BACK</p>
            <h1>Sign in to your <span>account.</span></h1>
        </section>

        <section class="auth-shell">
            <div class="auth-card">
                <div id="authMessage" class="auth-message" role="alert" aria-live="polite"></div>

                <form id="loginForm" novalidate>
                    <div class="field">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="primary-btn">Login</button>
                </form>

                <p class="auth-footer">New here? <a href="register.html">Create an account</a></p>
            </div>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="login.js"></script>
</body>

</html>
